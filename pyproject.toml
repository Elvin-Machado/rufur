[project]
name = "rufur"
version = "0.1.0"
description = "Knowledge Brain: a provenance-tracked memory layer for agents over MCP and REST"
readme = "README.md"
authors = [
    { name = "shravan-g-k", email = "shravangkulal.programs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "sqlite-vec>=0.1.9",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rufur = "rufur.daemon.cli:main"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",
    "transformers>=4.51",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
